name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'

      # One step, and deliberately the same one a contributor runs: npm's
      # prepare script installs web/ and builds web/dist. CI is set here, so
      # the web install goes through `npm ci` and honours the lockfile.
      # It must precede the server tests -- web/dist is gitignored, and the
      # CLI refuses to boot without it, so tests/cli.test.js would skip.
      - name: Install and build
        run: npm ci

      # Language runtimes the harness tests exercise. python3 and java are
      # preinstalled on ubuntu-latest; the tests skip whatever is missing.
      # Two tiers: unit runs in parallel, integration is serial because the
      # docker-backed tests share fixed container names and ports.
      - name: Server tests (unit)
        run: npm run test:unit

      - name: Server tests (integration)
        run: npm run test:integration

      - name: Web tests
        run: npm run test:web

      - name: Typecheck web
        run: npm --prefix web run typecheck

      # checkJs over the CommonJS server. Not a full strict-mode migration --
      # it catches the shape drift that the web's mirrored types would
      # otherwise only reveal at runtime.
      - name: Typecheck server
        run: npm run typecheck:server

      - name: Lint
        run: npm run lint
